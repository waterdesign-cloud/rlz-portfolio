<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/portfolio-design-system-03ed5cab-7880-4aa2-b819-a2eaba3528c8/tokens/tokens.css">
<script src="_ds/portfolio-design-system-03ed5cab-7880-4aa2-b819-a2eaba3528c8/_ds_bundle.js"></script>
</helmet>
<section data-screen-label="Project / {{ title }}" style="box-sizing: border-box; width: 100%; max-width: min(1200px, max(62.5vw, 600px)); margin: {{ marginTop }} auto 0; display: flex; flex-direction: column; gap: clamp(24px, 2.083vw, 40px);">
  <sc-if value="{{ showTitle }}" hint-placeholder-val="{{ true }}"><h2 class="h1" style="margin: 0; font-weight: 200; font-size: clamp(32px, 2.5vw, 48px); line-height: 1.5; color: var(--color-primary, #F2F2F2);">{{ title }}</h2></sc-if>
  {{ children }}
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;400px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Section&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;first&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const first = this.props.first === true || this.props.first === 'true';
    return {
      title: this.props.title ?? 'Section',
      showTitle: !(this.props.hideTitle === true || this.props.hideTitle === 'true'),
      marginTop: first ? '0' : 'clamp(96px, 8.333vw, 160px)'
    };
  }
}
</script>
</body>
</html>
