<script id="pt-loader-js">(function(){var raf,ready=false,last=performance.now(),t0=performance.now();try{new PerformanceObserver(function(l){if(l.getEntries().length)last=performance.now()}).observe({type:'resource',buffered:true})}catch(e){}function pct(b){var m=getComputedStyle(b).transform;var a=m&&m!=='none'?parseFloat(m.split('(')[1]):0;return Math.round(a*100)}function idle(){return ready&&document.readyState==='complete'&&(!document.fonts||document.fonts.status==='loaded')&&performance.now()-last>700}function tick(){var el=document.getElementById('pt-loader');if(!el)return;var b=el.querySelector('b'),n=el.querySelector('span');if(b&&n)n.textContent=pct(b)+'%';if(idle()||performance.now()-t0>20000){finish();return}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick);function finish(){if(window.__ptDone)return;window.__ptDone=true;cancelAnimationFrame(raf);var el=document.getElementById('pt-loader');if(!el){run();return}var b=el.querySelector('b'),n=el.querySelector('span');var t=getComputedStyle(b).transform;b.style.animation='none';b.style.transform=t;b.offsetWidth;b.style.transition='transform 260ms ease';b.style.transform='scaleX(1)';setTimeout(function(){if(n)n.textContent='100%';el.classList.add('done');run()},280);setTimeout(function(){el.remove()},800)}var cbs=[];function run(){var l=cbs;cbs=[];l.forEach(function(f){try{f()}catch(e){}})}window.__ptFinish=function(cb){ready=true;if(cb)cbs.push(cb);if(window.__ptDone&&!document.getElementById('pt-loader'))run()};window.addEventListener('pageshow',function(e){if(e.persisted)finish()})})();</script>

<div style="position: fixed; inset: 0; z-index: 100; background: #ebebeb; opacity: {{ coverOpacity }}; pointer-events: {{ coverPointer }}; transition: opacity 420ms ease-out;"></div>

<section data-screen-label="Graphic / Overview" style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background-image: url('assets/common_img_pattern.webp'); background-repeat: repeat; background-size: 250px 250px; color: var(--color-inverted-primary, #000000);">

    <img src="assets/gh_img_deco2.webp" alt="" style="position: absolute; right: -4%; top: 22%; width: clamp(77px, 7vw, 126px); height: auto; z-index: 3; transform: rotate(0deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1450ms both; animation-play-state: {{ uxPlay }};">
    <img src="assets/gh_img_deco3.webp" alt="" style="position: absolute; left: -8%; bottom: 16%; width: clamp(67px, 5.92vw, 104px); height: auto; z-index: 3; transform: rotate(-8deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1600ms both; animation-play-state: {{ uxPlay }};">
    <img src="assets/gh_img_deco4.webp" alt="" style="position: absolute; left: 1.5%; bottom: 5%; width: clamp(66px, 5.5vw, 99px); height: auto; z-index: 3; transform: rotate(8deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1750ms both; animation-play-state: {{ uxPlay }};">

          <sc-if value="{{ g.has }}" hint-placeholder-val="{{ false }}"><img src="{{ g.src }}" alt="{{ g.label }}" loading="lazy" decoding="async" width="960" height="960" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover;"></sc-if>
          <sc-if value="{{ g.none }}" hint-placeholder-val="{{ true }}"><span class="body2" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--color-second, #A7A7A7);">1 : 1</span></sc-if>
        </button>
      </sc-for>
    </div>
  </main>
</section>

<div ref="{{ lbRef }}" tabindex="-1" role="dialog" aria-modal="true" aria-hidden="{{ lbHidden }}" aria-label="{{ lbLabel }}" onClick="{{ close }}" style="outline: none; position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); opacity: {{ lbOpacity }}; pointer-events: {{ lbPointer }}; transition: opacity 280ms ease;">
  <div onClick="{{ stop }}" style="position: relative; width: min(84vw, calc(70vh * 2048 / 1160)); aspect-ratio: 2048 / 1160; margin: 62px 0 56px; border-radius: 4px; scale: {{ lbScale }}; transition: scale 360ms cubic-bezier(0.22, 1, 0.36, 1);">
    <div style="position: absolute; inset: 0; opacity: {{ swOpacity }}; translate: {{ swX }} 0; transition: {{ swTr }}; will-change: opacity, translate;">
    <sc-if value="{{ lbHas }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 4px; background: var(--color-inverted-second, #424242);"></div><div aria-hidden="true" style="position: absolute; inset: 0; background-image: {{ lbLow }}; background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 4px;"></div><div role="img" aria-label="{{ lbLabel }}" style="position: absolute; inset: 0; background-image: {{ lbBg }}; background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 4px; opacity: {{ lbImgOpacity }}; transition: opacity 320ms ease;"></div></sc-if>
    <sc-if value="{{ lbNone }}" hint-placeholder-val="{{ false }}"><span class="body2" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--color-second, #A7A7A7); background: var(--color-inverted-second, #424242); border-radius: 4px;">16 : 9</span></sc-if>
    </div>
    <button type="button" tabindex="{{ lbTab }}" onClick="{{ close }}" aria-label="Close" style="position: absolute; right: -9px; top: -66px; width: 75px; height: 57px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; background: transparent; color: var(--color-primary, #F2F2F2); cursor: pointer; transition: color 200ms ease;" style-hover="color: var(--color-second, #A7A7A7);"><svg width="66" height="31" viewBox="0 0 24 24" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="0.73" stroke-linecap="round" style="display: block;"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
  </div>
  
  <button type="button" tabindex="{{ lbTab }}" onClick="{{ prev }}" aria-label="上一張" style="all: unset; position: absolute; left: clamp(8px, 1.5vw, 28px); top: 50%; translate: 0 -50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--color-primary, #F2F2F2); cursor: pointer; transition: color 200ms ease;" style-hover="color: var(--color-second, #A7A7A7);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg></button>
  <button type="button" tabindex="{{ lbTab }}" onClick="{{ next }}" aria-label="下一張" style="all: unset; position: absolute; right: clamp(8px, 1.5vw, 28px); top: 50%; translate: 0 -50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--color-primary, #F2F2F2); cursor: pointer; transition: color 200ms ease;" style-hover="color: var(--color-second, #A7A7A7);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
  <div class="body2" style="position: absolute; bottom: clamp(16px, 2vw, 32px); left: 0; right: 0; text-align: center; color: var(--color-second, #A7A7A7);">{{ lbCount }}</div>
</div>

<dc-import name="Com_ToTop" tone="light" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false, open: -1 };
  lbRef = React.createRef();
  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 6000 }) : setTimeout(go, 16);
    go();
    this._key = (e) => {
      if (this.state.open < 0) return;
      if (e.key === 'Tab') {
        const box = this.lbRef.current; if (!box) return;
        const f = [...box.querySelectorAll('button')];
        const a = document.activeElement, first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (a === first || a === box)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && (a === last || !box.contains(a))) { e.preventDefault(); first.focus(); }
        return;
      }
      if (e.key === 'Escape') this.close();
      else if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentDidUpdate() {
    const o = this.state.open;
    if (o < 0 || o === this._lastOpen) return;
    this._lastOpen = o;
    const n = this.list().length;
    this.ready((o + 1) % n); this.ready((o - 1 + n) % n);
  }
  ready(i) {
    this._dec = this._dec || {};
    if (this._dec[i]) return this._dec[i];
    const f = this.list()[i].full;
    if (!f) return (this._dec[i] = Promise.resolve());
    const im = new Image();
    const hi = (window.devicePixelRatio || 1) > 1;
    if (hi) { const lo = new Image(); lo.src = `assets/${f}-1x.webp`; }
    im.src = `assets/${f}${hi ? '' : '-1x'}.webp`;
    im.decoding = 'async';
    this._ok = this._ok || {};
    const p = (im.decode ? im.decode() : new Promise((res, rej) => { im.onload = res; im.onerror = rej; }))
      .then(() => { this._ok[i] = true; if (this.state.shown === i) this.forceUpdate(); })
      .catch(() => { delete this._dec[i]; });
    return (this._dec[i] = p);
  }
  // 最多等 300ms：先顯示一般版，高解析版載好後淡入
  readySoon(i) {
    return Promise.race([this.ready(i), new Promise(r => setTimeout(r, 300))]);
  }
  show(i, token) {
    if (token !== this._tok) return;
    this.setState({ open: i, shown: i, phase: 'enter' });
    this._raf = requestAnimationFrame(() => { this._raf = requestAnimationFrame(() => { if (token === this._tok) this.setState({ phase: 'idle' }); }); });
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._fallback); window.removeEventListener('keydown', this._key); document.documentElement.style.overflow = ''; }
  navigate(url) { if (window.PT) window.PT.navigate(this, url); else window.location.href = url; }
  // 圖片放在 assets/：thumb = 1:1 縮圖（960）、full = 16:9 大圖（2048×1160）（不含 -1x / .webp）；空字串顯示佔位
  list() {
    return [
      { thumb: 'gd_img_camp2022_basic_cover', full: 'gd_img_camp2022_basic_kv', label: '原創漫畫創作營 2022 基礎班' },
      { thumb: 'gd_img_camp2022_advanced_cover', full: 'gd_img_camp2022_advanced_kv', label: '原創漫畫創作營 2022 進階班' },
      { thumb: 'gd_img_camp2023_cover', full: 'gd_img_camp2023_kv', label: '原創漫畫創作營 2023' },
      { thumb: 'gd_img_tiger_cover', full: 'gd_img_tiger_kv', label: '拜請虎將' },
      { thumb: 'gd_img_voice1_cover', full: 'gd_img_voice1_kv', label: '人聲百貨營業中' },
      { thumb: 'gd_img_voice2_cover', full: 'gd_img_voice2_kv', label: '聲音工作者的幕後物語' },
      { thumb: 'gd_img_europe_cover', full: 'gd_img_europe_kv', label: '漫筆歐洲' },
      { thumb: 'gd_img_classic_cover', full: 'gd_img_classic_kv', label: '老梗即經典' },
      { thumb: 'gd_img_backstage23_cover', full: 'gd_img_backstage23_kv', label: '漫畫幕後 23 事' },
      { thumb: 'gd_img_fingertip_cover', full: 'gd_img_fingertip_kv', label: '指尖上的漫畫' },
      { thumb: 'gd_img_reborn_cover', full: 'gd_img_reborn_kv', label: '漫畫成書轉生術' },
      { thumb: 'gd_img_camp2021_1_cover', full: 'gd_img_camp2021_1_kv', label: '原創漫畫創作營 2021 第一期' },
      { thumb: 'gd_img_camp2021_special_cover', full: 'gd_img_camp2021_special_kv', label: '原創漫畫創作營 2021 特別篇' },
      { thumb: 'gd_img_bl_yuri_cover', full: 'gd_img_bl_yuri_kv', label: '釋放散播 腐之力百合香' },
      { thumb: 'gd_img_bl_create_cover', full: 'gd_img_bl_create_kv', label: '腐之力開啟創造力' },
      { thumb: 'gd_img_printfactory_cover', full: 'gd_img_printfactory_kv', label: '突襲印刷廠' },
      { thumb: 'gd_img_warning_cover', full: 'gd_img_warning_kv', label: '創作警示燈' },
      { thumb: 'gd_img_train_cover', full: 'gd_img_train_kv', label: 'Ciao!! 臺漫列車新站點' },
      { thumb: 'gd_img_riso_cover', full: 'gd_img_riso_kv', label: 'RISO 印刷復古浪潮' },
      { thumb: 'gd_img_type01_cover', full: 'gd_img_type01_kv', label: '字體設計 01' },
      { thumb: 'gd_img_type02_cover', full: 'gd_img_type02_kv', label: '字體設計 02' }
    ].map(g => ({ thumb: g.thumb || '', full: g.full || '', label: g.label }));
  }
  openAt(i) {
    document.documentElement.style.overflow = 'hidden';
    this._ret = document.activeElement;
    requestAnimationFrame(() => this.lbRef.current && this.lbRef.current.focus({ preventScroll: true }));
    const t = this._tok = (this._tok || 0) + 1;
    cancelAnimationFrame(this._raf);
    this.setState({ open: i, phase: 'hide', dir: 0 });
    this.readySoon(i).then(() => this.show(i, t));
  }
  close() {
    this._tok = (this._tok || 0) + 1; this._lastOpen = -1; document.documentElement.style.overflow = ''; this.setState({ open: -1 });
    if (this._ret && this._ret.focus) this._ret.focus({ preventScroll: true });
  }
  step(d) {
    const n = this.list().length;
    const i = (this.state.open + d + n) % n;
    const t = this._tok = (this._tok || 0) + 1;
    cancelAnimationFrame(this._raf);
    this.setState({ open: i, phase: 'out', dir: d });
    Promise.all([new Promise(r => setTimeout(r, 170)), this.readySoon(i)]).then(() => this.show(i, t));
  }
  renderVals() {
    const { leaving, loaded, open } = this.state;
    const list = this.list();
    const bg = (f) => f ? `image-set(url("assets/${f}-1x.webp") 1x, url("assets/${f}.webp") 2x)` : 'none';
    const items = list.map((g, i) => ({
      label: g.label, has: !!g.thumb, none: !g.thumb, src: g.thumb ? `assets/${g.thumb}-1x.webp` : '',
      open: () => this.openAt(i),
      warm: () => this.ready(i),
      delay: (450 + Math.min(i, 8) * 90) + 'ms'
    }));
    const cur = list[this.state.shown ?? 0] || list[0];
    const isOpen = open >= 0;
    const seen = this.state.shown != null;
    const phase = this.state.phase || 'idle', dir = this.state.dir ?? 1;
    return {
      items,
      nav: (url) => this.navigate(url),
      close: () => this.close(),
      stop: (e) => e.stopPropagation(),
      prev: (e) => { e.stopPropagation(); this.step(-1); },
      next: (e) => { e.stopPropagation(); this.step(1); },
      lbOpacity: isOpen ? 1 : 0,
      lbPointer: isOpen ? 'auto' : 'none',
      lbRef: this.lbRef, lbHidden: isOpen ? 'false' : 'true', lbTab: isOpen ? 0 : -1,
      lbScale: isOpen ? '1' : '0.96',
      swOpacity: phase === 'idle' ? 1 : 0,
      swX: phase === 'out' ? (-dir * 28) + 'px' : phase === 'enter' ? (dir * 28) + 'px' : '0px',
      swTr: (phase === 'enter' || phase === 'hide') ? 'none' : phase === 'out' ? 'opacity 170ms ease-in, translate 170ms ease-in' : 'opacity 320ms ease-out, translate 420ms cubic-bezier(0.22, 1, 0.36, 1)',
      lbHas: seen && !!cur.full, lbNone: seen && !cur.full, lbBg: bg(cur.full), lbLow: cur.full ? `url("assets/${cur.full}-1x.webp")` : 'none', lbImgOpacity: (this._ok && this._ok[this.state.shown ?? 0]) ? 1 : 0, lbLabel: cur.label,
      lbCount: String((this.state.shown ?? 0) + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0'),
      ...(window.PT ? window.PT.cover(this, '#ebebeb') : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#ebebeb' }),
      uxPlay: loaded ? 'running' : 'paused'
    };
  }
}
</script>
