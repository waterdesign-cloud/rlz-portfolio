    window.addEventListener('pageshow', function (e) { if (e.persisted) { finish(); $('leave').classList.remove('on'); } });
  })();

  // 換頁淡出
  [].slice.call(document.querySelectorAll('.js-home')).forEach(function (a) { a.setAttribute('href', HOME); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.target === '_blank') return;
    var url = a.getAttribute('href');
    if (!url || url.charAt(0) === '#' || /^https?:/.test(url)) return;
    e.preventDefault();
    var lv = $('leave'); lv.style.background = /^UIUX_/.test(url) ? '#1B1C20' : '#ebebeb'; lv.classList.add('on');
    setTimeout(function () { location.href = url; }, 320);
  });

  // 導覽列
  var works = $('works'), wbtn = works.querySelector('.works-btn');
  wbtn.addEventListener('click', function (e) { e.stopPropagation(); var o = works.classList.toggle('open'); wbtn.setAttribute('aria-expanded', o); });
  window.addEventListener('click', function () { works.classList.remove('open'); wbtn.setAttribute('aria-expanded', 'false'); });
  var nav = $('nav'), totop = $('totop');
  function onScroll() { nav.classList.toggle('scrolled', scrollY > 8); totop.classList.toggle('show', scrollY > innerHeight * 0.6); }
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  totop.addEventListener('click', function () { scrollTo({ top: 0, behavior: 'smooth' }); });

  // 燈箱
  var lb = $('lb'), sw = $('lbSw'), lo = $('lbLo'), hi = $('lbHi'), cnt = $('lbCount');
  var HI = (window.devicePixelRatio || 1) > 1, cur = -1, tok = 0, ok = {}, dec = {}, ret = null;
  function ready(i) {
    if (dec[i]) return dec[i];
    var f = LIST[i].full;
    if (HI) { var l = new Image(); l.src = 'assets/' + f + '-1x.webp'; }
    var im = new Image(); im.decoding = 'async'; im.src = 'assets/' + f + (HI ? '' : '-1x') + '.webp';
    var p = (im.decode ? im.decode() : new Promise(function (r, j) { im.onload = r; im.onerror = j; }))
      .then(function () { ok[i] = true; if (cur === i) hi.classList.add('ok'); })
      .catch(function () { delete dec[i]; });
    return (dec[i] = p);
  }
  function soon(i) { return Promise.race([ready(i), new Promise(function (r) { setTimeout(r, 300); })]); }
  function paint(i, dir) {
    var f = LIST[i].full;
    lo.style.backgroundImage = 'url("assets/' + f + '-1x.webp")';
    hi.style.backgroundImage = 'image-set(url("assets/' + f + '-1x.webp") 1x, url("assets/' + f + '.webp") 2x)';
    hi.classList.toggle('ok', !!ok[i]);
    hi.setAttribute('aria-label', LIST[i].label); lb.setAttribute('aria-label', LIST[i].label);
    cnt.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(LIST.length).padStart(2, '0');
    sw.style.transition = 'none'; sw.style.opacity = 0; sw.style.translate = (dir * 28) + 'px 0';
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      sw.style.transition = 'opacity 320ms ease-out, translate 420ms cubic-bezier(0.22, 1, 0.36, 1)'; sw.style.opacity = 1; sw.style.translate = '0px 0';
    }); });
    var n = LIST.length; ready((i + 1) % n); ready((i - 1 + n) % n);
  }
  function setTab(v) { ['lbClose', 'lbPrev', 'lbNext'].forEach(function (id) { $(id).tabIndex = v; }); }
  function open(i) {
    ret = document.activeElement; document.documentElement.style.overflow = 'hidden';
    var t = ++tok; cur = i; sw.style.transition = 'none'; sw.style.opacity = 0;
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); setTab(0);
    requestAnimationFrame(function () { lb.focus({ preventScroll: true }); });
    soon(i).then(function () { if (t === tok) paint(i, 0); });
  }
  function close() {
    tok++; cur = -1; document.documentElement.style.overflow = '';
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); setTab(-1);
    if (ret && ret.focus) ret.focus({ preventScroll: true });
  }
  function step(d) {
    var n = LIST.length, i = (cur + d + n) % n, t = ++tok; cur = i;
    sw.style.transition = 'opacity 170ms ease-in, translate 170ms ease-in'; sw.style.opacity = 0; sw.style.translate = (-d * 28) + 'px 0';
    Promise.all([new Promise(function (r) { setTimeout(r, 170); }), soon(i)]).then(function () { if (t === tok) paint(i, d); });
  }
  [].slice.call(document.querySelectorAll('.card')).forEach(function (c) {
    var i = +c.dataset.i, warm = function () { ready(i); };
    c.addEventListener('click', function () { open(i); });
    c.addEventListener('mouseenter', warm); c.addEventListener('focus', warm); c.addEventListener('touchstart', warm, { passive: true });
  });
  lb.addEventListener('click', close);
  $('lbBox').addEventListener('click', function (e) { e.stopPropagation(); });
  $('lbClose').addEventListener('click', close);
  $('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
  $('lbNext').addEventListener('click', function (e) { e.stopPropagation(); step(1); });
  addEventListener('keydown', function (e) {
    if (cur < 0) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') {
      var f = [$('lbClose'), $('lbPrev'), $('lbNext')], a = document.activeElement;
      if (e.shiftKey && (a === f[0] || a === lb)) { e.preventDefault(); f[2].focus(); }
      else if (!e.shiftKey && (a === f[2] || !lb.contains(a))) { e.preventDefault(); f[0].focus(); }
    }
  });
})();
</script>
</body>
</html>
