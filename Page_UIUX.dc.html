<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; padding: 0; }
  body { background: #ebebeb; }
  a { color: var(--color-third, #4A4850); text-decoration: none; }
  a:hover { color: var(--color-second, #A7A7A7); }
  @keyframes uxHeadIn { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
  @keyframes uxDecoIn { 0% { opacity: 0; scale: 0.5; } 70% { opacity: 1; scale: 1.06; } 100% { opacity: 1; scale: 1; } }
  @keyframes uxCardIn { from { opacity: 0; translate: 0 36px; } to { opacity: 1; translate: 0 0; } }
</style>
</helmet>

<div style="position: fixed; inset: 0; z-index: 100; background: #ebebeb; opacity: {{ coverOpacity }}; pointer-events: {{ coverPointer }}; transition: opacity 420ms ease-out;"></div>
<div aria-hidden="true" style="position: fixed; inset: 0; z-index: 101; pointer-events: none; background: {{ coverBg }}; opacity: {{ leaveOpacity }}; transition: opacity 300ms ease-out;"></div>

<section data-screen-label="UIUX / Overview" style="position: relative; width: 100%; min-height: 100vh; overflow: hidden; background-image: url('assets/common_img_pattern.webp'); background-repeat: repeat; background-size: 250px 250px; color: var(--color-inverted-primary, #000000);">

  <div aria-hidden="true" style="height: 108px;"></div>
  <div style="position: fixed; top: 0; left: 0; right: 0; z-index: 70;"><dc-import name="Com_Nav" current="uiux" on-navigate="{{ nav }}" hint-size="100%,108px"></dc-import></div>

  <main style="position: relative; z-index: 2; box-sizing: border-box; width: 100%; max-width: 1240px; margin: 0 auto; padding: clamp(24px, 5vh, 72px) clamp(20px, 3vw, 48px) clamp(100px, calc(13.158vh + 15.79px), 200px); display: flex; flex-direction: column; gap: clamp(20px, 2.6vw, 44px);">
    <img src="assets/project_uiux_img_deco2.webp" alt="" style="position: absolute; right: 16%; top: 0; width: clamp(90px, 8vw, 140px); height: auto; z-index: 3; transform: rotate(-6deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1300ms both; animation-play-state: {{ uxPlay }};">
    <img src="assets/project_uiux_img_deco3.webp" alt="" style="position: absolute; right: -4%; top: 22%; width: clamp(110px, 10vw, 180px); height: auto; z-index: 3; transform: rotate(0deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1450ms both; animation-play-state: {{ uxPlay }};">
    <img src="assets/project_uiux_img_deco4.webp" alt="" style="position: absolute; left: -8%; bottom: 16%; width: clamp(84px, 7.4vw, 130px); height: auto; z-index: 3; transform: rotate(0deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1600ms both; animation-play-state: {{ uxPlay }};">
    <img src="assets/project_uiux_img_deco1.webp" alt="" style="position: absolute; left: 1.5%; bottom: 5%; width: clamp(60px, 5vw, 90px); height: auto; z-index: 3; transform: rotate(0deg); pointer-events: none; animation: uxDecoIn 600ms cubic-bezier(0.34, 1.4, 0.64, 1) 1750ms both; animation-play-state: {{ uxPlay }};">

    <div style="display: flex; flex-direction: column; gap: 4px; animation: uxHeadIn 900ms cubic-bezier(0.16, 1, 0.3, 1) 100ms both; animation-play-state: {{ uxPlay }};">
            <h1 class="h1" style="margin: 0; color: var(--color-inverted-primary, #000000);">UIUX Journey</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: clamp(14px, 1.3vw, 22px);">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="7">
        <a href="{{ p.href }}" onClick="{{ p.go }}" style="display: flex; flex-direction: column; gap: 12px; padding: 10px 10px 14px; border-radius: 12px; background: var(--color-primary, #F2F2F2); color: inherit; text-decoration: none; box-shadow: 0 1px 2px rgba(40, 40, 36, 0.08); transition: translate 320ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 320ms ease; animation: uxCardIn 900ms cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: {{ p.delay }}; animation-play-state: {{ uxPlay }};" style-hover="translate: 0 -6px; box-shadow: 0 14px 28px rgba(40, 40, 36, 0.16);">
          <div style="position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 2px; background: var(--color-second, #A7A7A7); display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{ p.cover }}" hint-placeholder-val="{{ false }}"><img srcset="{{ p.coverSet }}" alt="" width="1200" height="1600" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover;"></sc-if>
            <sc-if value="{{ p.noCover }}" hint-placeholder-val="{{ true }}"><span style="font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a8a85;">Cover</span></sc-if>
          </div>
          <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; align-items: start; padding: 0 4px;">
            <div style="width: 44px; height: 44px; border-radius: 8px; background: var(--color-inverted-primary, #000000); display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 13px; color: var(--color-primary, #F2F2F2);">{{ p.mark }}</div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <div class="body1" style="font-weight: 400; font-size: clamp(13px, 0.84vw, 15px); line-height: 1.5; color: var(--color-inverted-primary, #000000);">{{ p.title }}</div>
              <div class="body2" style="font-size: clamp(12px, 0.75vw, 14px); line-height: 1.6; color: var(--color-inverted-second, #424242); text-wrap: pretty;">{{ p.desc }}</div>
              <sc-if value="{{ p.hasTags }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-wrap: wrap; column-gap: 0.8em; row-gap: 0; margin-top: 4px;">
                  <sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="3">
                    <span class="body2" style="font-size: clamp(12px, 0.75vw, 14px); line-height: 1.6; color: var(--color-second, #A7A7A7); white-space: nowrap;"># {{ t }}</span>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</section>

<dc-import name="Com_ToTop" tone="light" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false };

  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 6000 }) : setTimeout(go, 16);
    go();
  }
  componentWillUnmount() { clearTimeout(this._fallback); }

  navigate(url) {
    if (window.PT) window.PT.navigate(this, url); else window.location.href = url;
  }


  // 卡片順序即顯示順序；cover 為 assets/ 檔名（不含 -1x / .webp）
  projects() {
    return [
      { page: 'UIUX_01_SDK.dc.html', title: 'PH 遊戲內儲值體驗', desc: '優化 PH 平台遊戲內的儲值與會員服務介面。', tags: ['app', 'claude design'], cover: 'uiux_img_cardover1' },
      { page: 'UIUX_02_B2B.dc.html', title: 'PH B2B 後臺', desc: '為 PlayHorny 合作廠商打造遊戲上架管理後台。', tags: ['dashboard', 'claude design'], cover: 'uiux_img_cardover_b2b' },
      { page: 'UIUX_03_PH_Login.dc.html', title: 'PH 登入註冊', desc: '優化 PH 平台活動頁登入介面。', tags: ['login/out'], cover: 'uiux_img_cardover_log' },
      { page: 'UIUX_04_Mega.dc.html', title: '莓卡遊戲 Mega Games', desc: '遊戲公司形象官方網站設計。', tags: ['visual', 'brand', 'design token'], cover: 'uiux_img_cardover_mega' },
      { page: 'UIUX_05_XXL.dc.html', title: 'XXL 猛漢町', desc: '遊戲官方網站設計。', tags: ['visual', 'campaign'], cover: 'uiux_img_cardover_xxl' },
      { page: 'UIUX_06_VK.dc.html', title: '時空心語 Valkyrieheart', desc: '遊戲官方網站設計。', tags: ['visual', 'campaign'], cover: 'uiux_img_cardover_vk' },
      { page: 'UIUX_07_SD.dc.html', title: '超感穿梭 Sensultra', desc: '遊戲官方網站設計。', tags: ['visual', 'campaign'], cover: 'uiux_img_cardover_sd' }
    ];
  }

  renderVals() {
    const { loaded } = this.state;
    const projects = this.projects().map((p, pos) => ({
      title: p.title,
      desc: p.desc || '專案簡述，一到兩行說明這個專案的內容。',
      mark: String(pos + 1).padStart(2, '0'),
      tags: p.tags || [], hasTags: !!p.tags,
      cover: !!p.cover, noCover: !p.cover,
      coverSet: p.cover ? `assets/${p.cover}-1x.webp 1x, assets/${p.cover}.webp 2x` : '',
      href: p.page,
      go: (e) => { e.preventDefault(); this.navigate(p.page); },
      delay: (450 + pos * 90) + 'ms'
    }));
    return {
      projects,
      nav: (url) => this.navigate(url),
      ...(window.PT ? window.PT.cover(this, '#ebebeb') : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#ebebeb' }),
      uxPlay: loaded ? 'running' : 'paused'
    };
  }
}
</script>
</body>
</html>
