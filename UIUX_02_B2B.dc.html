<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false };

  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 4000, hero: true }) : setTimeout(go, 16);
    go();
  }
  componentWillUnmount() { clearTimeout(this._fallback); this._io?.disconnect(); }

  // 步驟按鈕位置（% of 截圖），換版時改這裡
  BA_BTNS = {
    after:  [{ d: -1, label: '上一步', left: 1.6, width: 7.3 }, { d: 1, label: '下一步', left: 9.5, width: 7.3 }],
    before: [{ d: -1, label: '上一步', left: 1.9, width: 7.3 }, { d: 1, label: '下一步', left: [77.4, 70.3, 70.3, 70.3], width: 7.2 }],
    top: 92.5, height: 5.6
  };
  _baRefs = {};
  baRefs(b) {
    if (this._baRefs[b.id]) return this._baRefs[b.id];
    const r = { clip: React.createRef(), line: React.createRef(), box: null };
    r.box = b.steps ? (el) => {
      if (!el || this._io) return;
      this._io = new IntersectionObserver((es) => {
        if (!es.some(e => e.isIntersecting)) return;
        b.steps.slice(1).forEach(n => ['before', 'after'].forEach(k => { const i = new Image(); i.src = `assets/b2b_img_block4_${k}${n}${devicePixelRatio > 1 ? '' : '-1x'}.webp`; }));
        this._io.disconnect();
      }, { rootMargin: '600px 0px' });
      this._io.observe(el);
    } : undefined;
    return (this._baRefs[b.id] = r);
  }

  navigate(url) { window.PT ? window.PT.navigate(this, url) : (window.location.href = url); }


  baStep(b, d) {
    this.setState(s => {
      const cur = (s.baStep || {})[b.id] ?? 0;
      const nx = Math.max(0, Math.min(b.steps.length - 1, cur + d));
      return { baStep: { ...(s.baStep || {}), [b.id]: nx } };
    });
  }
  baLive(b, e, refs) {
    const r = e.currentTarget.getBoundingClientRect();
    const p = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
    this._baPos = p;
    if (refs.clip.current) refs.clip.current.style.clipPath = `inset(0 0 0 ${p}%)`;
    if (refs.line.current) refs.line.current.style.left = p + '%';
    e.currentTarget.setAttribute('aria-valuenow', Math.round(p));
  }

  renderVals() {
    const set = (n) => `image-set(url("assets/b2b_img_block4_${n}-1x.webp") 1x, url("assets/b2b_img_block4_${n}.webp") 2x)`;
    return {
      people: [
        { avatar: 'assets/uiux_img_user1.webp', name: 'PlayHorny', role: 'Product Planner' }
      ],
      software: [
        { icon: 'assets/uiux_icon_figma.webp', label: 'Figma' },
        { icon: 'assets/uiux_icon_claude.webp', label: 'Claude Design' }
      ],
      goBack: () => this.navigate('Page_UIUX.dc.html'),
      nav: (url) => this.navigate(url),
      baBlocks: [
        { id: 1, title: '後台主頁', ratio: '2400 / 1214' },
        { id: 2, title: '新增遊戲資料', ratio: '2400 / 1302', steps: [2, 3, 4, 5, 6] }
      ].map(b => {
        const pos = (this.state.ba || {})[b.id] ?? 50;
        const img = b.steps ? b.steps[(this.state.baStep || {})[b.id] ?? 0] : b.id;
        const refs = this.baRefs(b);
        const B = this.BA_BTNS;
        const cur = b.steps ? ((this.state.baStep || {})[b.id] ?? 0) : 0;
        const btns = (side) => b.steps ? B[side].filter(z => (z.d < 0 ? cur > 0 : cur < b.steps.length - 1)).map(z => ({
          label: z.label, left: (Array.isArray(z.left) ? z.left[cur] : z.left) + '%', width: z.width + '%', top: B.top + '%', height: B.height + '%',
          stop: (e) => e.stopPropagation(), click: () => this.baStep(b, z.d)
        })) : [];
        return {
          ...b, pos: Math.round(pos), left: pos + '%', clip: `inset(0 0 0 ${pos}%)`,
          beforeBg: set('before' + img), afterBg: set('after' + img),
          beforeBtns: btns('before'), afterBtns: btns('after'),
          boxRef: refs.box, clipRef: refs.clip, lineRef: refs.line,
          down: (e) => { this._baDrag = b.id; e.currentTarget.setPointerCapture?.(e.pointerId); this.baLive(b, e, refs); },
          move: (e) => { if (this._baDrag === b.id) this.baLive(b, e, refs); },
          up: () => {
            if (this._baDrag !== b.id) return;
            this._baDrag = null;
            const p = this._baPos;
            this.setState(s => ({ ba: { ...(s.ba || {}), [b.id]: p } }));
          },
          key: (e) => {
            const d = e.key === 'ArrowLeft' ? -5 : e.key === 'ArrowRight' ? 5 : 0;
            if (d) { e.preventDefault(); this.setState(s => ({ ba: { ...(s.ba || {}), [b.id]: Math.max(0, Math.min(100, ((s.ba || {})[b.id] ?? 50) + d)) } })); }
          }
        };
      }),
      ...(window.PT ? window.PT.cover(this) : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#1B1C20' })
    };
  }
}
</script>
