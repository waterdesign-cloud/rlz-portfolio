<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false };

  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 4000, hero: true }) : setTimeout(go, 16);
    go();
  }
  componentWillUnmount() { clearTimeout(this._fallback); if (this._io) this._io.disconnect(); }

  // 互動視窗：每個畫面為 assets/ 圖（寬 960）；spots 熱區用原圖像素 (x, y, w, h)；kind: 'btn' 整塊微亮 / 'field' 方框微亮 / 'text' 紫色底線
  static SCREENS = [
    { id: 'login', name: '會員登入', img: 'log_img_login', W: 960, H: 1436, spots: [
      { to: 're01', kind: 'text', label: '會員登錄', x: 91, y: 1074, w: 123, h: 41 },
      { to: 'forget01', kind: 'text', label: '忘記密碼', x: 747, y: 1074, w: 123, h: 41 }
    ] },
    { id: 're01', name: '註冊會員', img: 'log_img_re01', W: 960, H: 1396, spots: [
      { to: 're02', kind: 'btn', label: '註冊', x: 80, y: 1140, w: 800, h: 72 },
      { to: 'login', kind: 'text', label: '登入', x: 594, y: 1254, w: 59, h: 41 }
    ] },
    { id: 're02', name: '註冊完成', img: 'log_img_re02', W: 960, H: 964, spots: [
      { to: 'login', kind: 'btn', label: '登入', x: 80, y: 712, w: 800, h: 72 }
    ] },
    { id: 'forget01', name: '忘記密碼', img: 'log_img_forget01', W: 960, H: 1200, spots: [
      { to: 'forget02', kind: 'btn', label: '發送驗證碼', x: 80, y: 944, w: 800, h: 72 },
      { to: 'login', kind: 'text', label: '會員登入', x: 90, y: 1057, w: 124, h: 42 },
      { to: 're01', kind: 'text', label: '註冊', x: 809, y: 1057, w: 62, h: 42 }
    ] },
    { id: 'forget02', name: '輸入驗證碼', img: 'log_img_forget02', W: 960, H: 1280, spots: [
      { to: 'forget03', kind: 'field', label: '輸入驗證碼', x: 196, y: 500, w: 568, h: 120 },
      { to: 'forget01', kind: 'text', label: '返回', x: 434, y: 1138, w: 103, h: 41 }
    ] },
    { id: 'forget03', name: '重設密碼', img: 'log_img_forget03', W: 960, H: 1200, spots: [
      { to: 'forget04', kind: 'btn', label: '確認重設', x: 80, y: 1032, w: 800, h: 72 }
    ] },
    { id: 'forget04', name: '重設完成', img: 'log_img_forget04', W: 960, H: 1200, spots: [
      { to: 'login', kind: 'btn', label: '登入', x: 80, y: 1032, w: 800, h: 72 }
    ] }
  ];
  static HOVER = {
    btn: { radius: '999px', hoverBg: 'color-mix(in srgb, var(--color-primary, #F2F2F2) 12%, transparent)', hoverLine: 'none' },
    field: { radius: '8px', hoverBg: 'color-mix(in srgb, var(--color-primary, #F2F2F2) 12%, transparent)', hoverLine: 'none' },
    text: { radius: '0', hoverBg: 'transparent', hoverLine: 'inset 0 -1px 0 0 #8D62DB' }
  };

  // 靜態部分只算一次；畫面圖等視窗接近可視範圍才載入
  buildScreens() {
    const list = Component.SCREENS, maxH = Math.max(...list.map(s => s.H));
    const pct = (v, t) => (v / t * 100).toFixed(3) + '%';
    this._go = {};
    const go = (id) => this._go[id] ||= () => this.setState({ screen: id });
    return list.map(sc => ({
      id: sc.id, name: sc.name,
      bgSet: `image-set(url("assets/${sc.img}-1x.webp") 1x, url("assets/${sc.img}.webp") 2x)`,
      h: (sc.H / maxH * 78).toFixed(3) + '%', ar: sc.W + ' / ' + sc.H,
      spots: sc.spots.map(p => ({ ...Component.HOVER[p.kind], label: p.label, left: pct(p.x, sc.W), top: pct(p.y, sc.H), width: pct(p.w, sc.W), height: pct(p.h, sc.H), go: go(p.to) }))
    }));
  }
  stageRef = (el) => {
    if (this._io) { this._io.disconnect(); this._io = null; }
    if (!el || this.state.stageNear) return;
    if (!('IntersectionObserver' in window)) { this.setState({ stageNear: true }); return; }
    this._io = new IntersectionObserver((es) => {
      if (es.some(e => e.isIntersecting)) { this._io.disconnect(); this._io = null; this.setState({ stageNear: true }); }
    }, { rootMargin: '600px 0px' });
    this._io.observe(el);
  };
  screenVals() {
    this._screens ||= this.buildScreens();
    const cur = this.state.screen || 'login', near = !!this.state.stageNear;
    return {
      stageRef: this.stageRef,
      screens: this._screens.map(sc => {
        const on = sc.id === cur;
        return { ...sc, bg: near ? sc.bgSet : 'none', opacity: on ? 1 : 0, pointer: on ? 'auto' : 'none', hidden: on ? 'false' : 'true', tab: on ? 0 : -1 };
      })
    };
  }

  navigate(url) { window.PT ? window.PT.navigate(this, url) : (window.location.href = url); }


  renderVals() {
    return {
      people: [
        { avatar: 'assets/uiux_img_user1.webp', name: 'PlayHorny', role: 'Product Planner' },
        { avatar: 'assets/uiux_img_user2.webp', name: 'PlayHorny', role: 'Designer' }
      ],
      software: [
        { icon: 'assets/uiux_icon_figma.webp', label: 'Figma' }
      ],
      ...this.screenVals(),
      goBack: () => this.navigate('Page_UIUX.dc.html'),
      nav: (url) => this.navigate(url),
      ...(window.PT ? window.PT.cover(this) : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#1B1C20' })
    };
  }
}
</script>
