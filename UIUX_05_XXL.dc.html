<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&amp;family=Noto+Sans+TC:wght@200;300;400&amp;display=swap">

<style>
  html, body { margin: 0; padding: 0; }
  body { background: #1B1C20; }
  a { color: #F2F2F2; text-decoration: none; }
  a:hover { color: #A7A7A7; }
</style>
</helmet>

<div style="position: fixed; inset: 0; z-index: 100; background: #1B1C20; opacity: {{ coverOpacity }}; pointer-events: {{ coverPointer }}; transition: opacity 420ms ease-out;"></div>
<div aria-hidden="true" style="position: fixed; inset: 0; z-index: 101; pointer-events: none; background: {{ coverBg }}; opacity: {{ leaveOpacity }}; transition: opacity 300ms ease-out;"></div>

<div style="background: #1B1C20; color: var(--color-primary, #F2F2F2);">

  <dc-import name="Com_Project_Hero" src="assets/xxl_img_cover.webp" src1x="assets/xxl_img_cover-1x.webp" alt="XXL猛漢町 主視覺" hint-size="100%,500px">
    <div style="position: fixed; top: 0; left: 0; right: 0; z-index: 70;"><dc-import name="Com_Nav" current="" tone="dark" on-navigate="{{ nav }}" hint-size="100%,108px"></dc-import></div>
  </dc-import>

  <main style="box-sizing: border-box; width: 100%; max-width: calc(min(1460px, max(76.04vw, 720px)) + 2 * clamp(20px, 4vw, 64px)); margin: 0 auto; padding: 0 clamp(20px, 4vw, 64px) clamp(200px, 18vh, 300px); display: flex; flex-direction: column;">

    <dc-import name="Com_Project_Head" brand="XXL猛漢町" link="https://www.xxlwoofia.com/" about="雄猛、歡笑、活力…！
歡迎來到由人類、獸人與亞人等多種族和平共榮的「嗚拓邦 WOOFIA」。充滿日常感的毛絨冒險 RPG，跟著主角阿佑踏上冒險的征途。與形形色色、充滿獨特魅力的男子漢們相遇，碰撞出情熱的火花！" tags="UI Design, Design System, UX Design, Visual" category="Brand Website" device="Desktop &amp; Mobile" date="2025" software="{{ software }}" on-back="{{ goBack }}" hint-size="100%,1100px"></dc-import>

    <dc-import name="Com_Project_Section" title="Showcase" hide-title="true" first="true" hint-size="100%,400px">
      <div style="display: flex; flex-direction: column; gap: clamp(8px, 0.833vw, 16px);">
        <div style="display: grid; grid-template-columns: minmax(0, 1184fr) minmax(0, 1184fr); gap: clamp(8px, 0.833vw, 16px); align-items: start;">
          <img src="assets/xxl_img_block1-1-1x.webp" srcset="assets/xxl_img_block1-1-1x.webp 1x, assets/xxl_img_block1-1.webp 2x" alt="XXL猛漢町 手機版 Event 畫面" loading="lazy" decoding="async" width="1184" height="1144" style="display: block; width: 100%; height: auto;">
          <img src="assets/xxl_img_block1-2-1x.webp" srcset="assets/xxl_img_block1-2-1x.webp 1x, assets/xxl_img_block1-2.webp 2x" alt="XXL猛漢町 桌機版 首頁局部" loading="lazy" decoding="async" width="1184" height="1144" style="display: block; width: 100%; height: auto;">
        </div>
        <img src="assets/xxl_img_block1-3-1x.webp" srcset="assets/xxl_img_block1-3-1x.webp 1x, assets/xxl_img_block1-3.webp 2x" alt="XXL猛漢町 桌機版 首頁" loading="lazy" decoding="async" width="2400" height="1320" style="display: block; width: 100%; height: auto;">
      </div>
    </dc-import>

    <dc-import name="Com_Project_Section" title="Official" hint-size="100%,400px">
      <div style="display: flex; flex-direction: column; gap: clamp(8px, 0.833vw, 16px);">
        <img src="assets/xxl_img_offical-1x.webp" srcset="assets/xxl_img_offical-1x.webp 1x, assets/xxl_img_offical.webp 2x" alt="Official — 官方網站首頁" loading="lazy" decoding="async" width="2400" height="4525" style="display: block; width: 100%; height: auto;">
        <img src="assets/xxl_img_chara-1x.webp" srcset="assets/xxl_img_chara-1x.webp 1x, assets/xxl_img_chara.webp 2x" alt="Official — 角色介紹頁" loading="lazy" decoding="async" width="2400" height="3433" style="display: block; width: 100%; height: auto;">
      </div>
    </dc-import>

    <dc-import name="Com_Project_Section" title="CBT" hint-size="100%,400px">
      <img src="assets/xxl_img_cbt-1x.webp" srcset="assets/xxl_img_cbt-1x.webp 1x, assets/xxl_img_cbt.webp 2x" alt="CBT — 菁英刪檔封測活動頁" loading="lazy" decoding="async" width="2400" height="6005" style="display: block; width: 100%; height: auto;">
    </dc-import>

    <dc-import name="Com_Project_Section" title="Pre-registration" hint-size="100%,400px">
      <img src="assets/xxl_img_pre-1x.webp" srcset="assets/xxl_img_pre-1x.webp 1x, assets/xxl_img_pre.webp 2x" alt="Pre-registration — 事前預約活動頁" loading="lazy" decoding="async" width="2400" height="4813" style="display: block; width: 100%; height: auto;">
    </dc-import>
  </main>
</div>

<dc-import name="Com_ToTop" tone="dark" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { leaving: false, loaded: false };

  componentDidMount() {
    const go = () => window.PT ? window.PT.mount(this, { fallback: 4000, hero: true }) : setTimeout(go, 16);
    go();
  }
  componentWillUnmount() { clearTimeout(this._fallback); }

  navigate(url) { window.PT ? window.PT.navigate(this, url) : (window.location.href = url); }


  renderVals() {
    return {
      software: [
        { icon: 'assets/uiux_icon_figma.webp', label: 'Figma' }
      ],
      goBack: () => this.navigate('Page_UIUX.dc.html'),
      nav: (url) => this.navigate(url),
      ...(window.PT ? window.PT.cover(this) : { coverOpacity: 1, coverPointer: 'auto', leaveOpacity: 0, coverBg: '#1B1C20' })
    };
  }
}
</script>
</body>
</html>
