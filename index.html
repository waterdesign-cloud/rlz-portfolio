<script type="text/x-dc" data-dc-script data-props="{}">const TAGLINE = "A collection of my experiences, experiments, and work along the way.";
const DARK = ['graphic', 'uiux'];

class Component extends DCLogic {
  _cursor = React.createRef();
  state = { on: false, seen: false, modal: null, leaving: false, loaded: false };

  navigate(url) {
    this.setState({ on: false });
    if (window.PT) window.PT.navigate(this, url); else window.location.href = url;
  }


  // 彈窗圖預先下載並解碼，點擊時已就緒就立刻開啟
  modalUrls(key) { return ['assets/home_img_modal_deco_' + key + '.webp', DARK.includes(key) ? 'assets/home_img_modal_paper_dark.webp' : 'assets/home_img_modal_paper.webp']; }
  decodeImg(u) {
    this._dec ||= {}; this._ok ||= {}; this._imgs ||= [];
    if (!this._dec[u]) {
      const i = new Image(); i.decoding = 'async'; i.src = u; this._imgs.push(i);
      this._dec[u] = (i.decode ? i.decode() : Promise.resolve()).catch(() => {}).then(() => { this._ok[u] = true; });
    }
    return this._dec[u];
  }
  preloadModals() {
    ['ocean','hiking','graphic','uiux','code','english'].forEach(k => this.modalUrls(k).forEach(u => this.decodeImg(u)));
  }
  openModal(key) {
    const urls = this.modalUrls(key);
    if (urls.every(u => this._ok && this._ok[u])) { this.setState({ last: key, on: false, modal: key }); return; }
    this.setState({ last: key, on: false });
    Promise.all(urls.map(u => this.decodeImg(u))).then(() => this.setState({ modal: key }));
  }
  closeModal() { this.setState({ modal: null }); }

  componentDidUpdate() {
    if (!this._preloaded) { this._preloaded = true; this.preloadModals(); }
    if (this.state.loaded && !this._tagT) {
      const full = TAGLINE;
      this._tagT = setTimeout(() => {
        this.setState({ tagN: 0, tagStarted: true });
        this._tagI = setInterval(() => {
          const n = (this.state.tagN || 0) + 1;
          this.setState({ tagN: n });
          if (n >= full.length) clearInterval(this._tagI);
        }, 45);
      }, 0);
    }
  }
  componentDidMount() {
    if (this.state.loaded) this.componentDidUpdate({}, {});
    const go = () => window.PT ? window.PT.mount(this, { fallback: 6000 }) : setTimeout(go, 16);
    go();
    this._esc = (e) => { if (e.key === 'Escape' && this.state.modal) this.closeModal(); };
    window.addEventListener('keydown', this._esc);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._esc); clearTimeout(this._fallback); clearTimeout(this._tagT); clearInterval(this._tagI); }

  renderVals() {
    const { on, seen, modal } = this.state;
    const COPY = {
      english: { title: 'Learn English', body: '一段還在進行中的語言學習旅程。\n找尋保持動力的學習方式，\n練習勇敢開口說話。' },
      ocean: { title: 'Ocean', body: '海邊的紀錄與收集。\n踩踩水、聽著海浪拍打的聲音，\n什麼都不做，也能讓人放鬆下來。' },
      hiking: { title: 'Hiking', body: '一步一步往上邁步，\n走到山頂回頭往下看，\n一路走來的成就感浮現在心頭。' },
      graphic: { title: 'Graphic Design', body: '平面設計作品的累積，\n包含視覺設計、字型設計與展場設計，\n記錄不同類型的設計嘗試。' },
      uiux: { title: 'UIUX Journey', body: '介面與體驗設計的實作歷程。\n從網頁到 APP，一路嘗試不同的設計方式，\n慢慢累積自己的經驗。' },
      code: { title: 'Code', body: '在 AI 浪潮下，每個人都可以成為創作者。\n希望自己能了解程式的基礎邏輯，\n善用 AI 但不被 AI 框住。' }
    };
    const key = modal || this.state.last || 'english';
    const dark = DARK.includes(key);
    const shown = !!modal;
    const size = 114;
    return {
      openEnglish: () => this.openModal('english'),
      openOcean: () => this.openModal('ocean'),
      openHiking: () => this.openModal('hiking'),
      openGraphic: () => this.openModal('graphic'),
      openUiux: () => this.openModal('uiux'),
      openCode: () => this.openModal('code'),
      modalReady: true,
      modalPaperSrc: dark ? 'assets/home_img_modal_paper_dark.webp' : 'assets/home_img_modal_paper.webp',
      modalDecoSrc: 'assets/home_img_modal_deco_' + key + '.webp',
      modalInk: dark ? 'var(--color-primary, #F2F2F2)' : 'var(--color-inverted-primary, #000000)',
      modalBodyInk: dark ? 'var(--color-second, #A7A7A7)' : 'var(--color-inverted-primary, #000000)',
      modalTitle: COPY[key].title,
      modalBody: COPY[key].body,
      hasMore: dark,
      moreHref: key === 'graphic' ? 'Page_Graphic.dc.html' : 'Page_UIUX.dc.html',
      goMore: (e) => { const url = key === 'graphic' ? 'Page_Graphic.dc.html' : 'Page_UIUX.dc.html'; e.preventDefault(); this.setState({ modal: null }); this.navigate(url); },
      textTop: dark ? '0px' : '-10px',
      navPointer: this.state.modal ? 'none' : 'auto',
      bookPlay: this.state.loaded ? 'running' : 'paused',
      tagTyped: TAGLINE.slice(0, this.state.tagN || 0),
      tagStarted: !!this.state.tagStarted,
      nav: (url) => this.navigate(url),
      goWorkfile: () => this.navigate('Page_WorkFile.dc.html'),
      coverOpacity: (this.state.leaving || !this.state.loaded) ? 1 : 0,
      coverPointer: (this.state.leaving || !this.state.loaded) ? 'auto' : 'none',
      closeModal: () => this.closeModal(),
      modalCardStyle: {
        position: 'relative',
        width: 'min(1062px, 83vw)',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'flex-end',
        cursor: 'default',
        transform: 'translate(-7%, 10px)'
      },
      modalPaperStyle: {
        display: 'block',
        width: '74%',
        aspectRatio: '1600 / 849',
        backgroundImage: `url("${dark ? 'assets/home_img_modal_paper_dark.webp' : 'assets/home_img_modal_paper.webp'}")`,
        backgroundSize: '100% 100%',
        filter: 'drop-shadow(14px 18px 26px rgba(20, 24, 16, 0.42))',
        opacity: shown ? 1 : 0,
        animation: shown ? 'modalRiseIn 640ms cubic-bezier(0.16, 1, 0.3, 1) both' : 'none',
        transition: shown ? 'none' : 'opacity 200ms ease'
      },
      modalDecoStyle: {
        position: 'absolute',
        left: '13.98%',
        top: '-12.75%',
        bottom: 0,
        height: '112.75%',
        aspectRatio: '700 / 909',
        backgroundImage: `url("assets/home_img_modal_deco_${key}.webp")`,
        backgroundSize: '100% 100%',
        filter: 'drop-shadow(10px 14px 20px rgba(20, 24, 16, 0.38))',
        opacity: shown ? 1 : 0,
        animation: shown ? 'modalDropIn 1020ms cubic-bezier(0.18, 1, 0.28, 1) 100ms both' : 'none',
        transition: shown ? 'none' : 'opacity 200ms ease'
      },
      stopClick: (e) => e.stopPropagation(),
      modalOverlayStyle: {
        position: 'fixed',
        inset: 0,
        zIndex: 40,
        display: 'flex',
        visibility: shown ? 'visible' : 'hidden',
        pointerEvents: shown ? 'auto' : 'none',
        alignItems: 'center',
        justifyContent: 'center',
        background: 'rgba(0, 0, 0, 0.7)',
        backdropFilter: 'blur(1px)',
        cursor: 'pointer',
        opacity: shown ? 1 : 0,
        transition: shown
          ? 'opacity 340ms ease, visibility 0s'
          : 'opacity 260ms ease, visibility 0s linear 260ms'
      },
      cursorRef: this._cursor,
      onMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect(), el = this._cursor.current;
        if (el) { el.style.left = (e.clientX - r.left) + 'px'; el.style.top = (e.clientY - r.top) + 'px'; }
        if (!this.state.seen) this.setState({ seen: true });
      },
      onLeave: () => this.setState({ on: false }),
      onEnter: () => this.setState({ on: true }),
      onExit: () => this.setState({ on: false }),
      cursorStyle: {
        position: 'absolute',
        width: size + 'px',
        height: size + 'px',
        marginLeft: -size / 2 + 'px',
        marginTop: -size / 2 + 'px',
        borderRadius: '50%',
        background: 'var(--color-primary, #F2F2F2)',
        mixBlendMode: 'difference',
        display: seen ? 'flex' : 'none',
        alignItems: 'center',
        justifyContent: 'center',
        zIndex: 20,
        pointerEvents: 'none',
        opacity: on ? 1 : 0,
        transform: on ? 'scale(1)' : 'scale(0.6)',
        transition: 'opacity 260ms ease, transform 380ms cubic-bezier(0.22, 1, 0.36, 1)'
      }
    };
  }
}</script>
</body>
